name: StarPlayrXiOS
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    iOS: "17.0"
packages:
  StarPlayrKit:
    path: ../StarPlayrKit
targets:
  StarPlayrX:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: StarPlayrKit
    scheme:
      testTargets:
        - StarPlayrXUITests
      environmentVariables:
        OS_ACTIVITY_MODE: disable
        OS_ACTIVITY_DT_MODE: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: StarPlayrX
        CFBundleShortVersionString: "1.3.1"
        CFBundleVersion: "21"
        LSApplicationCategoryType: public.app-category.music
        CFBundleURLTypes:
          - CFBundleURLName: com.starplayrx.ios
            CFBundleURLSchemes: [starplayrx]
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: StarPlayrX
        PRODUCT_BUNDLE_IDENTIFIER: com.toddbruss.StarPlayr
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 469UCUB275
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StarPlayrXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: StarPlayrX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toddbruss.StarPlayr.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 469UCUB275
        TEST_TARGET_NAME: StarPlayrX
