name: StarPlayrXMac
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    macOS: "13.0"
targets:
  StarPlayrXMac:
    type: application
    platform: macOS
    sources:
      - Sources
    scheme:
      testTargets:
        - StarPlayrXMacTests
      environmentVariables:
        OS_ACTIVITY_MODE: disable
        OS_ACTIVITY_DT_MODE: "NO"
    entitlements:
      path: Sources/StarPlayrX.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.starplayrx.mac"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: StarPlayrX
        CFBundleShortVersionString: "1.1.11"
        CFBundleVersion: "16"
        LSUIElement: true
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: StarPlayrX.sdef
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: StarPlayrX
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.mac
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 469UCUB275
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StarPlayrXMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: StarPlayrXMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.mac.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"   # XCTest itself requires macOS 14
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 469UCUB275
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StarPlayrX.app/Contents/MacOS/StarPlayrX"
        BUNDLE_LOADER: "$(TEST_HOST)"
